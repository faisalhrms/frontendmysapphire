<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml">
<head>
  <meta charset="UTF-8">
  <!--[if mso]>
  <style type="text/css">
    body, table, td, a, span { font-family:Calibri !important; }
  </style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;font-family:Calibri;">
  <table cellpadding="0" cellspacing="0" border="0" width="300" style="font-family:Calibri;color:#000000;line-height:1.3;">
    <tr>
      <td style="padding-top:40px;padding-left:10px;">
        <table cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="font-family:Calibri;font-size:10.5pt;font-weight:bold;">{{name}}</td>
          </tr>
          <tr>
            <td style="font-family:Calibri;font-size:10pt;">{{title}}</td>
          </tr>
          <tr>
            <td style="font-family:Calibri;font-size:10pt;">{{mobile}}</td>
          </tr>
          <tr>
            <td style="padding-top:18px; padding-bottom: 6px">
              <img src="{{image_url}}" alt="SAPPHIRE" width="130" height="auto" style="display:block;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding-top:5px;font-family:Calibri;font-size:10pt;">
              1.5-Km, Defence Road, Bhubtian Chowk,<br>
              Off Raiwind Road, Lahore, Pakistan.
            </td>
          </tr>
          <tr>
            <td style="padding-top:10px">
              <a href="{{website}}" target="_blank" style="color:#000000;text-decoration:underline;font-family:Calibri;font-size:8pt;font-weight:bold;">
                SAPPHIREONLINE.PK
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding-top:5px">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td>
                    <a href="{{facebook_url}}" target="_blank">
                      <img src="{{facebook}}" alt="Facebook" width="18" height="18" style="display:block;border:0;">
                    </a>
                  </td>
                  <td>
                    <a href="{{instagram_url}}" target="_blank">
                      <img src="{{instagram}}" alt="Instagram" width="18" height="18" style="display:block;border:0;">
                    </a>
                  </td>
                  <td>
                    <a href="{{linkedin_url}}" target="_blank">
                      <img src="{{linkedin}}" alt="LinkedIn" width="18" height="18" style="display:block;border:0;">
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
